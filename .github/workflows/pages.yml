name: Redirect Tuim website to Rtuim

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/site.css
      - packaging/tuim.svg
      - docs/**
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage redirect to Rtuim
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=https://tuim-editor.github.io/Rtuim/">
            <link rel="canonical" href="https://tuim-editor.github.io/Rtuim/">
            <meta name="robots" content="noindex">
            <title>Tuim is now Rtuim</title>
          </head>
          <body>
            <h1>Tuim is now Rtuim</h1>
            <p>We recoded the app in Rust. Rtuim is open source under the MIT license.</p>
            <p><a href="https://tuim-editor.github.io/Rtuim/">Visit the Rtuim website</a>.</p>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
