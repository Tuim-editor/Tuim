name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Check Zig formatting
        run: zig fmt --check build.zig src/main.zig src/nvim/ui_protocol.zig src/tui/renderer.zig
      - name: Run tests
        run: zig build test
      - name: Install stable Neovim for PTY tests
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/nvim.tar.gz" \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Run pseudo-terminal integration tests
        run: |
          zig build
          python3 tests/controlling_tty.py
          python3 tests/pty_integration.py
          python3 tests/default_runtime.py
      - name: Test plugin management and Extensions UI
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          mkdir -p "$HOME/.local/share/tuim/lazy"
          git clone --depth 1 --branch stable https://github.com/folke/lazy.nvim.git "$HOME/.local/share/tuim/lazy/lazy.nvim"
          python3 tests/plugin_manager.py
          python3 tests/plugins_ui.py
      - name: Check shell scripts
        run: shellcheck setup.sh update.sh uninstall.sh build_appimage.sh src/software_update.sh packaging/tuim-launcher scripts/plugin_smoke.sh scripts/capture_media.sh tests/setup_plans.sh tests/launcher_smoke.sh tests/ide_mode.sh tests/onboarding.sh tests/appimage_smoke.sh tests/media_assets.sh tests/terminal_compat.sh
      - name: Validate generated media
        run: tests/media_assets.sh
      - name: Validate static website
        run: python3 tests/site.py
      - name: Validate recorded performance profile
        run: python3 tests/performance_profile.py
      - name: Test installer package-manager plans
        run: |
          bash tests/setup_plans.sh
          python3 tests/setup_install.py
      - name: Test symlinked release launcher
        run: sh tests/launcher_smoke.sh

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Build ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

  macos-smoke:
    # macOS end-to-end behavior still needs broader verification. Keep collecting
    # the full smoke log without blocking Linux release readiness.
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Install Neovim
        run: brew list neovim >/dev/null 2>&1 || brew install neovim
      - name: Build and run Zig tests on macOS
        timeout-minutes: 5
        run: |
          set -o pipefail
          zig build test 2>&1 | tee "$RUNNER_TEMP/macos-smoke.log"
          zig build 2>&1 | tee -a "$RUNNER_TEMP/macos-smoke.log"
      - name: A/B controlling terminal input across terminal.zig versions
        timeout-minutes: 25
        run: |
          set -o pipefail
          sw_vers
          git fetch --depth=1 origin main fix/macos-input-and-qa-bugs
          git show origin/main:src/tui/terminal.zig > "$RUNNER_TEMP/v_main.zig"
          git show origin/fix/macos-input-and-qa-bugs:src/tui/terminal.zig > "$RUNNER_TEMP/v_prfix.zig"
          cp src/tui/terminal.zig "$RUNNER_TEMP/v_mine.zig"
          for v in main prfix mine; do
            cp "$RUNNER_TEMP/v_$v.zig" src/tui/terminal.zig
            sha=$(shasum -a 256 src/tui/terminal.zig | cut -d' ' -f1)
            n=$(grep -c isPollable src/tui/terminal.zig || true)
            echo "=== VARIANT $v sha256=$sha isPollable_lines=$n ==="
            if [ "$v" = main ] && [ "$n" != "0" ]; then
              echo "ABORT: origin/main copy is not the pre-fix file"; exit 1
            fi
            zig build
            for i in 1 2 3; do
              if python3 tests/controlling_tty.py > "$RUNNER_TEMP/ab-$v-$i.txt" 2>&1; then
                echo "RESULT $v attempt $i PASS"
              else
                echo "RESULT $v attempt $i FAIL"
                sed -n '1,60p' "$RUNNER_TEMP/ab-$v-$i.txt"
              fi
            done
          done
          cp "$RUNNER_TEMP/v_mine.zig" src/tui/terminal.zig
      - name: Test IDE mode on macOS
        timeout-minutes: 5
        run: |
          set -o pipefail
          tests/ide_mode.sh 2>&1 | tee -a "$RUNNER_TEMP/macos-smoke.log"
      - name: Test onboarding on macOS
        timeout-minutes: 5
        run: |
          set -o pipefail
          tests/onboarding.sh 2>&1 | tee -a "$RUNNER_TEMP/macos-smoke.log"
      - name: Test terminal compatibility on macOS
        timeout-minutes: 5
        env:
          TUIM_TEST_SKIP_STARTUP_FAILURE: "1"
        run: |
          set -o pipefail
          tests/terminal_compat.sh host 2>&1 | tee -a "$RUNNER_TEMP/macos-smoke.log"
      - name: Upload macOS smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-terminal-smoke
          path: ${{ runner.temp }}/macos-smoke.log

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "**/*.md"
          fail: true
